    <script>
      window.addEventListener('error', function (event) {
        console.error('KoobNaaba runtime error:', event.error || event.message);
      });
      window.addEventListener('unhandledrejection', function (event) {
        console.error('KoobNaaba unhandled rejection:', event.reason);
      });

      // Immediately retire any legacy PWA service worker before the next
      // navigation. This prevents stale HTML/JS from masking deployments.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          if (!registrations.length) return;
          return Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          })).then(function () {
            if (navigator.serviceWorker.controller) {
              window.location.reload();
            }
          });
        }).catch(function (error) {
          console.warn('KoobNaaba service-worker cleanup skipped:', error);
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
